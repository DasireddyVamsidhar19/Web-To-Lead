<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web to Lead form</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.google.com/recaptcha/api.js"></script>
    <script src="index.js"></script>
</head>
<body>

    <h1>Create Lead</h1>

<META HTTP-EQUIV="Content-type" CONTENT="text/html; charset=UTF-8">
    
    <form action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00DIR000001tlwb" 
    method="POST" onsubmit="handleSubmit()">
    
    <input type=hidden name='captcha_settings' value='{"keyname":"WebToLeadForm","fallback":"true","orgId":"00DIR000001tlwb","ts":""}'>
    <input type=hidden name="oid" value="00DIR000001tlwb">
    <input type=hidden name="retURL" value="https://dasireddyvamsidhar19.github.io/Web-To-Lead/Thanks.html">
    <input type=hidden name="Lead_Date__c" class="outputDate">
    <label for="first_name">First Name</label>
    <input  id="first_name" maxlength="40" name="first_name" size="20" type="text" required="true"/><br>
    
    <label for="last_name">Last Name</label>
    <input  id="last_name" maxlength="80" name="last_name" size="20" type="text" required="true" /><br>
    
    <label for="email">Email</label>
    <input  id="email" maxlength="80" name="email" size="20" type="text" required="true" /><br>
    <label for="date">Lead Date</label>
    <input id="date" type="date" required="true" class="inputDate"/>
    <!-- Lead Date:<span class="dateInput dateOnlyInput"><input  id="00NIR00000EpRrC" name="00NIR00000EpRrC" size="12" type="text" /></span><br> -->
    
    <div data-callback="handleCaptche" class="g-recaptcha" data-sitekey="6LftXSkrAAAAAB2WDZ2rRPQGrAuOc36vSyf0fG1m"></div><br>

    <input type="submit" name="submit" class="sbmtButton">
    </form>
    
</body>
</html>
